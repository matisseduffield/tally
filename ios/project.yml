# The Xcode project is made from this file by XcodeGen (see .github/workflows/ios.yml).
name: Tally
options:
  bundleIdPrefix: com.matisseduffield
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  Tally:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shell
      - path: ../web
        type: folder
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Tally
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: Page
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLName: com.matisseduffield.tally
            CFBundleURLSchemes: [tally]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matisseduffield.tally
