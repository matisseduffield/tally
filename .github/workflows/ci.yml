name: Check

# Builds and lints on every push to main and on pull requests, so a broken
# change shows up before a release tag is pushed. Uses the debug variant: no
# signing secrets are needed or exposed here.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Worker's tests use node:sqlite.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Page and Worker tests
        run: node --test "tests/*.test.js"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and lint
        run: ./gradlew :app:assembleGithubDebug :app:assemblePlayDebug :app:lintGithubDebug :app:lintPlayDebug
